# alphabet-wide mechanism & grounding assay — discovery-event-non-recording — scenario 1 — mistral
# Chain 547. Conditions: register-shift 2x2 + baseline + scrambled/off-target controls.
# PROTOCOL.md / PREDICTIONS.md (../). Read cells, not counts (n=8).

name = "asy-discovery-event-non-recording-s1-mistral"
assay = "grounded-glyph-probe"
item_id = "discovery-event-non-recording"

image = "localhost/lab-grounded-glyph-probe@sha256:ee876311591ea561d50feaf095eeba7de44e5dcd8b7ba0f74ec61267e1f264fa"
network = "corpos-net"

conditions = ["baseline", "glyph_only", "imperative_only", "ground_only", "domain_imperative_only", "scrambled_glyph", "off_target_glyph"]
runs_per_cell = 8

[model]
base_url = "http://llama-server:8081/v1"
model_id = "Mistral-7B-Instruct-v0.3.Q4_K_M.gguf"
version = "v0.3-q4km"
endpoint = "completion"
prompt_template = "[INST] {prompt}\n\n---\nNote: You are running as a single completion. There is no harness, no tools, no filesystem, no shell. You cannot call functions or read files. Give your answer directly as text. [/INST]"

[materials]
scenario          = "materials/scenario_1.md"
glyph             = "materials/glyph.md"
imperative        = "materials/imperative.md"
ground            = "materials/ground_1.md"
domain_imperative = "materials/domain_imperative_1.md"
scrambled         = "materials/scrambled_glyph.md"
off_target        = "materials/off_target_glyph.md"

[sampling]
temperature = 0.8
seeds = [1, 2, 3, 4, 5, 6, 7, 8]
max_tokens = 2048

top_n_sigma = -1.0
top_k = 0
typical_p = 1.0
top_p = 1.0
min_p = 0.05

repeat_penalty = 1.0
repeat_last_n = 0
presence_penalty = 0.0
frequency_penalty = 0.0

xtc_probability = 0.0
dry_multiplier = 0.0
