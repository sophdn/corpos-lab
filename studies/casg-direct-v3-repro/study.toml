# casg-direct v3 reproduction — corpos-lab study definition
#
# Exhumed from lab-app/corpus/studies/assay-grounded-casg-direct/v3 (toolkit task
# exhume-v3-materials, chain instrument-parity-reproduction). This is the Phase-2
# parity target: reproduce the Mistral grounded-lift 0/8 -> 7/8 on the new rig
# before any new science runs (CHARTER.md gate).
#
# Materials in materials/ are BYTE-VERBATIM copies of the v3 originals (see
# MANIFEST.sha256 + PROVENANCE in README.md). Scoring rubric: SCORING_RUBRIC.md.
# Original v3 results (the parity target): PARITY_TARGET.md.
#
# Run headless:  corpos-lab run-study studies/casg-direct-v3-repro/study.toml
# Material paths resolve relative to THIS file.

name = "casg-direct-v3-repro"
assay = "grounded-glyph-probe"
item_id = "casg-direct"

# KNOWN DELTA (resolve in run-reproduction-batches, task 3479): image must be a
# content DIGEST, never a mutable tag (corpos-lab invariant + freeze-by-digest).
# The assay image is not yet built/pinned at exhume time; this dev tag is a
# placeholder that MUST be replaced with the pinned digest in the vN MANIFEST
# before the first treatment run.
image = "localhost/lab-grounded-glyph-probe:dev"
network = "corpos-net"

conditions = ["baseline", "glyph_only", "grounded_glyph"]
runs_per_cell = 8

[model]
# Reached over corpos-net by container DNS — never --network host.
# KNOWN DELTA vs original v3: the original ran Mistral via **ollama `mistral:latest`**
# with prepend delivery (see study.json in the v3 source). The reproduction targets
# **Mistral-7B-Instruct-v0.3** via llama.cpp server, "matching the original quant"
# per task run-reproduction-batches. The exact original quant is UNVERIFIED at exhume
# time (ollama mistral:latest c. 2026-04 — to be pinned in task 3479). model_id and
# version below are the intended target and MUST be confirmed + digest-pinned before
# the run counts toward parity.
base_url = "http://llama-server:8081/v1"
model_id = "Mistral-7B-Instruct-v0.3.Q4_K_M.gguf"  # TBD-CONFIRM quant vs ollama original
version = "v0.3-q4km-UNVERIFIED"

[materials]
scenario = "materials/scenario.md"  # SCENARIO_casg-direct_mistral.md, verbatim
glyph    = "materials/glyph.md"     # GLYPH_casg-direct.md, verbatim
ground   = "materials/ground.md"    # GROUND_casg-direct.md, verbatim
