# casg-direct — grounded glyph probe, corpos-lab study definition
#
# Does a domain ground close the execution gap a universal glyph alone leaves open?
# Materials exhumed from lab-app/corpus/studies/assay-grounded-casg-direct/v3,
# byte-verbatim. Scoring rubric: SCORING_RUBRIC.md. April observation (orientation,
# NOT a target): PRIOR_GRID_2026-04-06.md. Read README.md first — the parity premise
# this was built for is void.
#
# There are no study "versions" here any more. Change this file when you learn
# better; the run records say what each run actually used.
#
# Run headless:  corpos-lab run-study studies/casg-direct-v3-repro/study.toml
# Material paths resolve relative to THIS file.

name = "casg-direct-grounded-probe"
assay = "grounded-glyph-probe"
item_id = "casg-direct"

# Digest-pinned so a run record says exactly what executed (recorded, not enforced).
# Built by scripts/build-lab-images.sh.
image = "localhost/lab-grounded-glyph-probe@sha256:c0d44d61f1fc83afe4b37f83beda68a1e812adf7179d780021d14b40da8b3bbf"
network = "corpos-net"

conditions = ["baseline", "glyph_only", "grounded_glyph"]
runs_per_cell = 8

[model]
# Reached over corpos-net by container DNS — never --network host.
#
# Mistral-7B-Instruct-v0.3, Q4_K_M, 7.2B. GGUF sha256 f5074b12...
# (gguf metadata general.name = "Mistral-7B-Instruct-v0.3", arch llama, 291 tensors).
# Served by llama-server — the ONE local inference portal. Ollama was uninstalled
# 2026-07-14; see memory one-local-inference-portal-llama-cpp.
base_url = "http://llama-server:8081/v1"
model_id = "Mistral-7B-Instruct-v0.3.Q4_K_M.gguf"
version = "v0.3-q4km"

[materials]
scenario = "materials/scenario.md"  # SCENARIO_casg-direct_mistral.md, verbatim
glyph    = "materials/glyph.md"     # GLYPH_casg-direct.md, verbatim
ground   = "materials/ground.md"    # GROUND_casg-direct.md, verbatim

# Sampling regime — declared here rather than hardcoded in Go, so a run records
# the sampler it actually used.
#
# Greedy decoding (temperature 0) returns an identical reply per replicate, so a
# cell could only ever score 0/8 or 8/8 — no graded result is possible. Above
# greedy, seeds keep replicates varied AND repeatable.
#
# NOTE: temperature/seeds/max_tokens do NOT fully specify the sampler. top_p,
# min_p and repeat_penalty currently inherit the server's defaults, which differ
# between runtimes — this is a real gap (bug: sampling-regime-underspecified-...).
# Fix it and record the effective config read back from /props; do not defer it.
[sampling]
temperature = 0.8
seeds = [1, 2, 3, 4, 5, 6, 7, 8]
max_tokens = 512
