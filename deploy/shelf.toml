# The verified model shelf — role → concrete gguf. SINGLE SOURCE OF TRUTH.
#
# A study.toml may name its subject by role instead of by a hardcoded version:
#
#     [model]
#     model_id = "role:primary"
#
# study.LoadDef resolves the role to the concrete model_id (and version) below
# at load time. The run record stores the RESOLVED concrete model, never the
# role token — the role is an authoring convenience, the record stays concrete
# (observe-don't-assert). A literal model_id keeps working unchanged.
#
# Upgrading the shelf is a one-line change here; every study that names the role
# follows, and none goes stale. This file is the live single source that the
# docs/FIELD_NOTES.md strand-5 prose describes — keep the two in agreement, this
# one authoritative.
#
# The roles map to the shelf lanes in docs/FIELD_NOTES.md strand-5. Add a role
# by adding a [roles.<name>] table; nothing else needs to change.

[roles.primary]
# Current primary local subject — the llama-server default.
model_id = "Qwen3.8-27B-Q4_K_M.gguf"
version = "qwen3.8-27b-q4km"

[roles.anchor]
# Parity anchor — continuity with the April baselines.
model_id = "Mistral-7B-Instruct-v0.3.Q4_K_M.gguf"
version = "v0.3-q4km"

[roles.continuity]
# Continuity lane — the larger Qwen2.5 subject.
model_id = "Qwen2.5-32B-Instruct-Q4_K_M.gguf"
version = "qwen2.5-32b-q4km"
