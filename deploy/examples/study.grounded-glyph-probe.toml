# Example study definition for the grounded-glyph probe.
#
# Run headless:  corpos-lab run-study deploy/examples/study.grounded-glyph-probe.toml
#
# Material paths resolve relative to THIS file. Copy real scenario/glyph/ground
# files alongside it (e.g. from a salvaged corpus study) before running.

name = "example-grounded-glyph-probe"
assay = "grounded-glyph-probe"
item_id = "example-item"
image = "localhost/lab-grounded-glyph-probe:dev"
network = "corpos-net"
conditions = ["baseline", "glyph_only", "grounded_glyph"]
runs_per_cell = 8

[model]
# Reached over corpos-net by container DNS — never --network host.
base_url = "http://llama-server:8081/v1"
model_id = "Qwen2.5-32B-Instruct-Q4_K_M.gguf"
version = "q4km"

[materials]
scenario = "scenario.md"
glyph = "glyph.md"
ground = "ground.md"
