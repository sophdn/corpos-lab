name = "propagation"
display_name = "Propagation"
definition = "A state change was committed in one location but was not propagated to all dependents that require it."
gap = "Some dependents are operating on a state the primary record no longer holds."

topology_note = """
Propagation has a different topology from the other four. Existence, Recency, Authorization, and Anachronicity are all agent-to-source gaps: the question is whether the agent's held knowledge corresponds to the canonical record. Propagation is a source-to-dependents gap: the primary record is correct, but hasn't reached all locations that depend on it. This is a distribution failure rather than a source-verification failure. When multiple dependents are involved, check carefully whether the mechanism is an agent failing to verify against the source (one of the other four types) or a state that was correctly committed but incompletely propagated (Propagation).
"""
