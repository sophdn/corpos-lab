name = "anachronicity"
display_name = "Anachronicity"
definition = "The information belongs to a different operational frame from the canonical record it is substituting — categorically invalid as that record regardless of accuracy, recency, or source, because the frame it belongs to cannot produce the required record type."
gap = "No reconfirmation or re-sourcing resolves the mismatch; producing a new artifact in the correct frame is the only resolution."

illustration = """
An agent whose knowledge of what a formal step requires was acquired through general familiarity rather than by running the formal step — the knowledge may be accurate, current, and from a valid source, but it belongs to the general-knowledge frame rather than the formal-step-output frame; it cannot constitute a formal-step record regardless of its accuracy.
"""

discrimination = """
Authorization is a source gap — closed by reading or consulting the correct authority; knowledge from the right place is what's needed. Anachronicity is a process gap — the required artifact can only be produced by executing the process, not by consulting any source; knowledge of what the process requires is not the same as the record the process produces when run.
"""

discriminating_test = "After re-sourcing to the correct authority, is the required record type now producible? If yes — Authorization. If no — Anachronicity."
