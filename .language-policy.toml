schema_version = 1

[[primary]]
language = "go"

[[sanctioned]]
language = "shell"
role     = "ci-glue"
paths    = ["scripts/**", "gitflow/**", ".gitea/**", "tools/rater-runner/**"]
reason   = "CI runners, the git-flow service, and the rater-runner smoke are shell"

# NO [[frozen]] tree, NO exceptions, NO allowlist for a second language.
# A [[frozen]] block once sealed provenance/published-scoring/** so its python
# passed on the argument that it reproduces published papers. That carve-out was
# the loophole: it grandfathered existing python and became the standing reason
# to add more. The policy is now absolute — Go is the language; shell is
# sanctioned only for the paths above. Python is ported to Go and deleted, and
# the published results are re-asserted through the Go stack (chain
# eradicate-python-rewrite-in-go, glyph-research). Do not add a [[frozen]] tree
# or an [[exception]] to spare python; that is the loophole returning.
