schema_version = 1

[[primary]]
language = "go"

[[sanctioned]]
language = "shell"
role     = "ci-glue"
paths    = ["scripts/**", "gitflow/**", ".gitea/**"]
reason   = "CI runners and the git-flow service are shell"

# Sealed provenance of published paper scoring methods. Immutable: existing
# files pass, a new file committed here is a breach. Papers point at it.
[[frozen]]
path   = "provenance/published-scoring/**"
reason = "sealed provenance of published paper scoring methods"
